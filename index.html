<title>부석고등학교</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#f2f2f2; }
  body { display:flex; justify-content:center; }
  .stage { position:relative; width:100%; max-width:1894px; }
  .stage > img.base { width:100%; display:block; }
  a.hot { position:absolute; display:block; cursor:pointer; background:transparent;
          border-radius:6px; transition:background .12s, box-shadow .12s; }
  a.hot:hover { background:rgba(40,110,200,.18); box-shadow:0 0 0 2px rgba(40,110,200,.55) inset; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.84);
             display:none; align-items:center; justify-content:center; z-index:9999; padding:20px; }
  .overlay.show { display:flex; animation:fade .22s ease; }
  @keyframes fade { from{opacity:0; transform:scale(.98);} to{opacity:1; transform:scale(1);} }
  .overlay .box { position:relative; }
  .overlay img.poster { max-width:min(560px,92vw); max-height:86vh; border-radius:12px;
                        box-shadow:0 24px 70px rgba(0,0,0,.6); display:block; }
  .overlay .close { position:absolute; top:-16px; right:-16px; width:44px; height:44px;
                    border-radius:50%; background:#fff; color:#333; border:none;
                    font-size:26px; line-height:1; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .overlay .hint { position:absolute; bottom:-36px; left:0; right:0; text-align:center;
                   color:#fff; font-size:13px; opacity:.85; }
</style>

<script>
  var overlay = document.getElementById('overlay');
  function openModal(){ overlay.classList.add('show'); }
  function closeModal(){ overlay.classList.remove('show'); }

  // 모든 버튼(투명 클릭 영역) -> 2번째 사진 표시
  document.querySelectorAll('a.hot').forEach(function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); openModal(); });
  });

  document.getElementById('closeBtn').addEventListener('click', function(e){ e.stopPropagation(); closeModal(); });
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });
</script>
